services:
  backend:
    build:
      context: https://github.com/ronaldyu001/harness-backend.git#dev
    image: harness-backend:dev
    container_name: harness-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    # Map container port to computer port.
    ports:
      - "8000:8000"
    volumes:
      - mem0:/home/appuser/.mem0
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LITELLM_TIMEOUT: ${LITELLM_TIMEOUT}
      LITELLM_MAX_RETRIES: ${LITELLM_MAX_RETRIES}
      QDRANT_URL: ${QDRANT_URL}
      MEM0_QDRANT_URL: ${MEM0_QDRANT_URL}
      MEM0_DIR: ${MEM0_DIR}
      MEM0_COLLECTION_NAME: ${MEM0_COLLECTION_NAME}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL}
      MEM0_EMBEDDER_MODEL: ${MEM0_EMBEDDER_MODEL}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-768}
      MEM0_HISTORY_DB_PATH: ${MEM0_HISTORY_DB_PATH}
    depends_on:
      litellm:
        condition: service_healthy
      ollama-pull-embedder:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()",
        ]
      interval: 60s
      timeout: 3s
      retries: 6
      start_period: 5s

  litellm:
    image: ghcr.io/berriai/litellm:v1.91.0
    container_name: harness-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      LITELLM_OLLAMA_MODEL: ollama/${OLLAMA_MODEL}
    # Map litellm config to the container path as read only.
    volumes:
      - ./LiteLLM_config.yaml:/app/config.yaml:ro
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    # Check if endpoint is hittable instead of checking /health.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness').read()",
        ]
      interval: 60s
      timeout: 3s
      retries: 8
      start_period: 10s

  ollama:
    image: ollama/ollama:0.31.1
    container_name: harness-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 60s
      timeout: 3s
      retries: 12
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:0.31.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ${OLLAMA_BASE_URL}
    command: ["pull", "${OLLAMA_MODEL}"]
    restart: "no"

  ollama-pull-embedder:
    image: ollama/ollama:0.31.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ${OLLAMA_BASE_URL}
    command: ["pull", "${MEM0_EMBEDDER_MODEL}"]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    container_name: harness-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  mem0:
  ollama:
  qdrant:
